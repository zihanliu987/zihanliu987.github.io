<div class="masthead">
  <div class="masthead__inner-wrap">
    <a class="site-name" href="#about-me" target="_self">{{ site.author.name }}</a>
    <div class="masthead__menu">
      <nav class="homepage-nav" aria-label="Main navigation">
        <ul>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}"{% if link.url contains '#' %} target="_self"{% endif %}>{{ link.title }}</a></li>
          {% endfor %}
        </ul>
      </nav>
    </div>
  </div>
</div>
